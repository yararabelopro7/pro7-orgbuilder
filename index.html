<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PRO7 OrgBuilder</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="login" class="login" hidden>
  <form id="loginForm" class="card login-card">
    <h1>PRO7 OrgBuilder</h1>
    <p class="muted">Gestão de organogramas para consultorias de DHO.</p>
    <label>Seu nome
      <input name="user" required maxlength="60" placeholder="Ex.: Maria Silva" autocomplete="name">
    </label>
    <button class="btn primary" type="submit">Entrar</button>
  </form>
</div>

<div id="app" hidden>
  <header class="header">
    <div class="brand">PRO7 <span>OrgBuilder</span></div>
    <nav class="nav" aria-label="Menu principal">
      <button type="button" data-view="dashboard">Painel</button>
      <button type="button" data-view="org">Organograma</button>
      <button type="button" data-view="companies">Empresas / Setores</button>
      <button type="button" id="logout" class="logout">Sair</button>
    </nav>
  </header>

  <main class="main">

    <!-- PAINEL -->
    <section id="view-dashboard" class="view">
      <h2>Painel</h2>
      <div id="stats" class="stats"></div>
      <div class="card">
        <h3>Comparativo AS IS e TO BE</h3>
        <p class="muted" id="cmpCompany"></p>
        <div class="table-wrap"><table id="cmpTable"></table></div>
      </div>
    </section>

    <!-- ORGANOGRAMA -->
    <section id="view-org" class="view">
      <h2>Organograma</h2>
      <div class="toolbar card">
        <label>Empresa <select id="companySel"></select></label>
        <div class="seg" role="group" aria-label="Cenário">
          <button type="button" data-sc="asis">AS IS (atual)</button>
          <button type="button" data-sc="tobe">TO BE (planejada)</button>
        </div>
        <div class="spacer"></div>
        <button type="button" class="btn" id="copyScenario">Copiar AS IS para TO BE</button>
        <button type="button" class="btn primary" id="exportJson">Exportar JSON</button>
      </div>

      <div class="card">
        <div class="tree-wrap"><div id="tree" class="tree"></div></div>
      </div>

      <div class="grid2">
        <form id="empForm" class="card" novalidate>
          <h3 id="empFormTitle">Novo colaborador</h3>
          <label>Nome <input name="nome" required maxlength="80"></label>
          <label>Cargo <input name="cargo" required maxlength="80"></label>
          <label>Setor / Departamento <input name="setor" required maxlength="60" list="deptList"></label>
          <datalist id="deptList"></datalist>
          <label>E-mail <input name="email" type="email" maxlength="120"></label>
          <label>Gestor imediato (a quem responde)
            <select name="gestor"></select>
          </label>
          <p id="empErr" class="error" role="alert" hidden></p>
          <div class="actions">
            <button class="btn primary" type="submit" id="empSubmit">Adicionar colaborador</button>
            <button class="btn" type="button" id="empCancel" hidden>Cancelar edição</button>
          </div>
        </form>

        <div class="card">
          <h3>Colaboradores do cenário</h3>
          <div class="table-wrap"><table id="empTable"></table></div>
        </div>
      </div>
    </section>

    <!-- EMPRESAS -->
    <section id="view-companies" class="view">
      <h2>Empresas / Setores</h2>
      <div class="grid2">
        <form id="coForm" class="card">
          <h3>Nova empresa</h3>
          <label>Nome <input name="nome" required maxlength="80"></label>
          <label>Segmento
            <input name="segmento" required maxlength="60" list="segList" placeholder="Ex.: Indústria, Varejo, Serviços">
          </label>
          <datalist id="segList">
            <option>Indústria</option><option>Varejo</option><option>Serviços</option>
            <option>Saúde</option><option>Tecnologia</option><option>Agronegócio</option>
          </datalist>
          <div class="actions"><button class="btn primary" type="submit">Cadastrar empresa</button></div>
        </form>
        <div class="card">
          <h3>Empresas cadastradas</h3>
          <div class="table-wrap"><table id="coTable"></table></div>
        </div>
      </div>
    </section>

  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</div>

<script src="script.js"></script>
</body>
</html>
